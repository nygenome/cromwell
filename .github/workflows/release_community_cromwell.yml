name: Release Community Cromwell

on:
  workflow_dispatch: 

jobs:
  cromwell-release:
    name: Release Community Cromwell
    runs-on: ubuntu-latest
    steps:
    - uses: sbt/setup-sbt@v1

    - name: Clone Cromwell
      uses: actions/checkout@v6
      with:
        repository: ${{ github.repository }}
        path: cromwell
        ref: master
        # fetch-depth 0 tells the action to include all past commits in the checkout.
        # This is needed to smoothly perform the below merge of `develop` into `master`.
        # Without the existing commits, git doesn't understand how the branches are
        # related to each other.
        fetch-depth: 0

    - name: Find Cromwell release number
      run: |
        set -e
        cd cromwell
        # Extract MAJOR version from project/Version.scala
        VERSION_IN_SOURCE=$(grep -m 1 "cromwellVersion" project/Version.scala | sed -E 's/.*"([^"]+)".*/\1/')
        MAJOR_VERSION=$(echo "$VERSION_IN_SOURCE" | cut -d. -f1)

        # Latest release tag from GitHub
        LATEST_TAG=$(curl -s -X GET https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r .tag_name)

        if [[ "$LATEST_TAG" =~ ^$MAJOR_VERSION\.([0-9]+)$ ]]; then
          MINOR=${BASH_REMATCH[1]}
          RELEASE_VERSION="$MAJOR_VERSION.$((MINOR + 1))"
        else
          # If no previous release for this major, or latest release is a different major
          RELEASE_VERSION="$MAJOR_VERSION.0"
        fi

        echo "MAJOR_VERSION=${MAJOR_VERSION}" >> $GITHUB_ENV
        echo "RELEASE_VERSION=${RELEASE_VERSION}" >> $GITHUB_ENV
        echo "Upstream version: $VERSION_IN_SOURCE, Major: $MAJOR_VERSION, Release: $RELEASE_VERSION"

    - name: Prepare release notes
      run: |
        set -e
        cd cromwell
        # Try to find release notes for the full version (e.g., ## 92.4)
        sed -n "/## ${RELEASE_VERSION}/,/## [0-9]/p" CHANGELOG.md | sed '$d' > changelog.txt
        # If not found, try to find release notes for the major version (e.g., ## 92)
        if [ ! -s changelog.txt ]; then
          sed -n "/## ${MAJOR_VERSION}/,/## [0-9]/p" CHANGELOG.md | sed '$d' > changelog.txt
        fi

    - name: Build jars for new release
      run: |
        set -e
        cd cromwell
        git checkout master
        # Use sbt.server.forcestart to workaround https://github.com/sbt/sbt/issues/6101
        echo 'Assemble jars for cromwell and womtool'
        sbt \
        -Dsbt.server.forcestart=true \
        -Dproject.version=${RELEASE_VERSION} \
        -Dproject.isSnapshot=false \
        server/assembly \
        womtool/assembly

    - name: Push changes to origin
      run: |
        set -e
        cd cromwell
        git push origin master

    - name: Create Github release
      uses: softprops/action-gh-release@v2
      with:
        body_path: cromwell/changelog.txt
        tag_name: ${{ env.RELEASE_VERSION }}
        files: |
          cromwell/server/target/scala-2.13/cromwell-${{ env.RELEASE_VERSION }}.jar
          cromwell/womtool/target/scala-2.13/womtool-${{ env.RELEASE_VERSION }}.jar
        token: ${{ secrets.GITHUB_TOKEN }}
